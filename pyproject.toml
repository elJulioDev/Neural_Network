[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NeuralNetwork"
version = "1.0.0"
description = "Libreria de Deep Learning vectorizada con API estilo Keras, caches externos y persistencia portable"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "elJulioDev"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.21.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.5.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/elJulioDev/Neural_Network"
Repository = "https://github.com/elJulioDev/Neural_Network"

[tool.setuptools.packages.find]
include = ["nnlib*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long — relaxed for readability
    "E741",  # ambiguous variable name — common in math code (l, x, y)
]
